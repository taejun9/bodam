[package]
name = "bodam"
version = "0.1.0"
description = "BODAM local desktop CRM"
authors = ["BODAM"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "bodam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
e2e = [
  "custom-protocol",
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "=0.36.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "=1.4.0"
fast-float2 = "=0.2.3"
quick-xml = { version = "=0.41.0", features = ["encoding"] }
rusqlite = { version = "0.38", features = ["backup", "bundled"] }
rust_xlsxwriter = "=0.96.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
unicode-normalization = "=0.1.24"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_SystemServices",
  "Win32_System_WindowsProgramming",
] }
