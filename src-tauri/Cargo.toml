[package]
name = "bodam"
version = "0.1.0"
description = "BODAM local desktop CRM"
authors = ["BODAM"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "bodam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
e2e = [
  "custom-protocol",
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "=0.36.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "=1.4.0"
fast-float2 = "=0.2.3"
quick-xml = { version = "=0.41.0", features = ["encoding"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rust_xlsxwriter = "=0.96.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
unicode-normalization = "=0.1.24"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"
