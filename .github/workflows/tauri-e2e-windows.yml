name: Windows NSIS and installed E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bodam-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  windows-installer-e2e:
    name: Current-user NSIS and installed application
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run hosted cleanup safety negative controls
        id: host_safety
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File e2e/test-windows-host-safety.ps1

      - name: Verify npm command trust before npm execution
        id: npm_trust
        run: python3 -I harness/scripts/windows_npm_preflight.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Install locked dependencies
        id: dependencies
        run: npm ci --ignore-scripts

      - name: Run cross-layer QA
        id: cross_layer_qa
        run: npm run qa

      - name: Run Windows all-feature Rust tests
        id: windows_tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Build unsigned production NSIS
        id: production_build
        run: npm run package:windows

      - name: Assert production install lifecycle and stage release evidence
        id: production_lifecycle
        run: npm run windows:assert:production

      - name: Build private E2E NSIS
        id: e2e_build
        run: npm run e2e:build:windows-nsis

      - name: Run full suite from the installed E2E binary
        id: installed_e2e
        run: npm run test:e2e:windows-installed

      - name: Remove exact app-owned CI state
        id: cleanup
        if: always() && steps.npm_trust.outcome == 'success'
        run: npm run windows:cleanup

      - name: Record hosted evidence boundary
        if: always()
        shell: pwsh
        run: |
          "## Windows release evidence scope" >> $env:GITHUB_STEP_SUMMARY
          "- runner: windows-2025" >> $env:GITHUB_STEP_SUMMARY
          "- jobStatus: ${{ job.status }}" >> $env:GITHUB_STEP_SUMMARY
          "- crossLayerQa: ${{ steps.cross_layer_qa.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- hostSafety: ${{ steps.host_safety.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- npmTrust: ${{ steps.npm_trust.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- windowsTests: ${{ steps.windows_tests.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- productionBuild: ${{ steps.production_build.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- productionLifecycle: ${{ steps.production_lifecycle.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- e2eBuild: ${{ steps.e2e_build.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- installedE2e: ${{ steps.installed_e2e.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- cleanup: ${{ steps.cleanup.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "- production installer: unsigned current-user NSIS" >> $env:GITHUB_STEP_SUMMARY
          "- installed application scope: full synthetic E2E" >> $env:GITHUB_STEP_SUMMARY
          "- offlineVmAccepted: false" >> $env:GITHUB_STEP_SUMMARY
          "This hosted run does not replace a WebView2-missing, network-disabled clean VM acceptance run." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload accepted unsigned production installer
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bodam-windows-x64-unsigned
          path: |
            runtime-data/windows-release/BODAM_0.1.0_x64-setup.exe
            runtime-data/windows-release/BODAM_0.1.0_x64-setup.exe.sha256
            runtime-data/windows-release/evidence.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
